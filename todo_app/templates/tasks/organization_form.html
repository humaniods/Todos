{% extends 'tasks/base.html' %}

{% block content %}
<div class="mx-auto" style="max-width: 720px;">
  <h2 class="mb-3">Create Organization</h2>
  <p class="text-muted">Set up the first OfficeDiary workspace. The creator becomes the initial owner.</p>
  <form method="post" class="row g-3">
    {% csrf_token %}
    {% for field in form %}
    <div class="col-12 {% if field.name == 'name' %}col-lg-12{% else %}col-lg-6{% endif %}">
      <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
    </div>
    {% endfor %}
    <div class="col-12"><button class="btn btn-primary">Create Workspace</button></div>
  </form>
</div>
{% endblock %}
